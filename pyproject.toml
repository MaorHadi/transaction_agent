[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transaction-agent"
version = "0.1.0"
description = "A crypto trading bot with an honest backtester, built on the Alpaca API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
transaction-agent = "transaction_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
